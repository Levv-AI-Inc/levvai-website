<title>Levv Flow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one slim top bar, then a full-height canvas. Everything else (add step, settings, test, Nova) opens as a drawer only when asked for. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#eef2f6; --line:#d7e0e7; --fg:#0e1a23; --muted:#5a6b78;
  --accent:#0891b2; --accent-strong:#0e7490; --accent-soft:#e0f4f9; --on-accent:#ffffff;
  --amber:#b45309; --amber-soft:#fdf1d8; --rose:#be123c; --rose-soft:#ffe4e8; --emerald:#047857; --emerald-soft:#d8f5e8; --violet:#6d28d9; --violet-soft:#efe7ff;
  --cv:#0a0f1a; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060b12; --surface:#0f1723; --surface-2:#152030; --line:#233246; --fg:#e4ecf2; --muted:#8a9bab;
  --accent:#22d3ee; --accent-strong:#67e8f9; --accent-soft:#0a3340; --on-accent:#03141a;
  --amber:#fbbf24; --amber-soft:#33260a; --rose:#fb7185; --rose-soft:#3a0f1a; --emerald:#34d399; --emerald-soft:#082b20; --violet:#c4b5fd; --violet-soft:#241a3d; --cv:#05080f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060b12; --surface:#0f1723; --surface-2:#152030; --line:#233246; --fg:#e4ecf2; --muted:#8a9bab;
  --accent:#22d3ee; --accent-strong:#67e8f9; --accent-soft:#0a3340; --on-accent:#03141a;
  --amber:#fbbf24; --amber-soft:#33260a; --rose:#fb7185; --rose-soft:#3a0f1a; --emerald:#34d399; --emerald-soft:#082b20; --violet:#c4b5fd; --violet-soft:#241a3d; --cv:#05080f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{padding-inline:16px;padding-block:10px 16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.03em}.logo i{font-style:normal;color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.switch{position:relative}
.switch-btn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:8px;padding:4px 8px;font-weight:700;font-size:16px;max-width:min(420px,60vw)}
.switch-btn:hover{border-color:var(--line);background:var(--surface)}
.switch-btn span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch-btn .car{color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.live{background:var(--emerald)}.dot.draft{background:var(--amber)}.dot.dirty{background:var(--accent)}
.menu-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.18);width:340px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;padding:6px}
.mg{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;font-size:13.5px}
.mi:hover{background:var(--surface-2)}
.mi[aria-current="true"]{background:var(--accent-soft)}
.mi .t{flex:1;min-width:0}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);background:var(--violet-soft);border-radius:5px;padding:1px 6px}
.status{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px}
.count{min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.count.zero{background:var(--emerald)}

/* Canvas */
.stage{position:relative;height:calc(100vh - 78px);min-height:540px;border-radius:14px;overflow:hidden;background:var(--cv);border:1px solid #1b2536}
.cscroll{position:absolute;inset:0 78px 0 0;overflow:auto;background-color:var(--cv);background-image:radial-gradient(#1b2537 1.1px,transparent 1.4px);background-size:22px 22px}
.csizer{position:relative}
.cinner{position:absolute;left:0;top:0;transform-origin:0 0}
.nd{position:absolute;width:88px}
.sq{position:relative;width:88px;height:88px;border-radius:18px;background:#141c2c;border:1.5px solid #2b3950;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.45);transition:border-color .15s,box-shadow .15s;padding:0}
.sq:hover{border-color:#4a5d7c}
.sq svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.k-trigger .sq{border-radius:44px 18px 18px 44px;color:#fb923c}
.k-end .sq{border-radius:50%;color:#34d399}
.k-cond .sq,.k-plan .sq{color:#4ade80}.k-policy .sq{color:#34d399}.k-appr .sq,.k-runappr .sq{color:#22d3ee}
.k-notify .sq,.k-update .sq{color:#cbd5e1}.k-task .sq{color:#f0abfc}.k-wait .sq,.k-gate .sq{color:#fbbf24}.k-parallel .sq,.k-integ .sq,.k-runwf .sq{color:#60a5fa}
.k-dw .sq{color:#ddd6fe;background:radial-gradient(circle at 35% 30%,#33255a,#171029);border-color:#7c5cd6;border-radius:50%}
.nd.on .sq{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee,0 0 28px rgba(34,211,238,.25)}
.nd.dim{opacity:.4}
.nd.sel .sq{outline:2px solid #67e8f9;outline-offset:4px}
.nd.drop .sq{border-color:#a78bfa;box-shadow:0 0 0 2px #a78bfa,0 0 28px rgba(167,139,250,.4)}
.flag{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#f59e0b;color:#1a1204;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--cv)}
.pcs{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.pcs span{width:20px;height:20px;border-radius:50%;background:#1f1638;border:1.5px solid #8b5cf6;display:grid;place-items:center}
.pcs svg{width:11px;height:11px;stroke:#ddd6fe;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nl{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:176px;text-align:center;pointer-events:none}
.nl b{display:block;color:#e8eef5;font-size:13px;font-weight:600;line-height:1.3}
.nl span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#8796ab;font-size:11.5px;line-height:1.35;margin-top:2px}
.port{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cv);border:2px solid #52627c}
.nd.on .port{border-color:#22d3ee}
.port.in{left:-6px}.port.out{right:-6px}
.plabel{position:absolute;left:calc(100% + 12px);font-size:10.5px;color:#a3b1c4;font-weight:600;white-space:nowrap;background:var(--cv);padding:0 4px;border-radius:4px}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path{fill:none;stroke:#334259;stroke-width:2}
svg.edges path.on{stroke:#22d3ee;stroke-width:2.6}
svg.edges path.bad{stroke:#f59e0b;stroke-dasharray:6 5}
.plus{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#101828;border:1px solid #3a4a64;color:#a3b1c4;font-size:16px;line-height:1;display:grid;place-items:center;opacity:.35;transition:opacity .12s,transform .12s;padding:0;z-index:2}
.cinner:hover .plus{opacity:.8}
.plus:hover,.plus:focus-visible,.plus.active{opacity:1 !important;border-color:#22d3ee;color:#fff;transform:scale(1.1)}
.cinner.dropping .plus,.cinner.placing .plus{opacity:1;width:32px;height:32px;margin:-16px 0 0 -16px;border:1.5px dashed #22d3ee;color:#22d3ee;background:#062029}
.plus.over{transform:scale(1.3);background:#22d3ee !important;color:#03141a !important}

.rail{position:absolute;right:0;top:0;bottom:0;width:78px;background:#0c1220;border-left:1px solid #1b2536;overflow:auto;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3}
.rail-h{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8796ab;text-align:center;line-height:1.3;margin-bottom:6px}
.dw{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#cbd5e1;padding:5px 2px;width:100%;border-radius:8px;cursor:grab}
.dw:hover{background:#141d2e}
.dw[aria-pressed="true"]{background:#1d1536}
.dw-c{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3b2a63,#1a1230);border:1.5px solid #8b5cf6;box-shadow:0 0 14px rgba(139,92,246,.3)}
.dw-c svg{width:18px;height:18px;stroke:#ddd6fe;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dw-s{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid #0c1220}
.dw-s.ready{background:#34d399}.dw-s.setup{background:#fbbf24}.dw-s.off{background:#64748b}
.dw.off .dw-c{opacity:.4;box-shadow:none}
.dw-n{font-size:10px;text-align:center;line-height:1.2}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;gap:4px;z-index:4}
.zoom button{height:32px;min-width:32px;padding:0 9px;border-radius:8px;background:#121a2a;border:1px solid #2a3850;color:#cbd5e1;font-size:13px;font-weight:600}
.zoom button:hover{border-color:#22d3ee;color:#fff}
.ask{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 240px));display:flex;gap:6px;z-index:4;background:#0f1726;border:1px solid #2a3850;border-radius:12px;padding:5px 5px 5px 12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ask span{color:#22d3ee;align-self:center}
.ask input{flex:1;min-width:0;background:transparent;border:0;color:#e2e8f0;font-size:13.5px;outline:none}
.ask input::placeholder{color:#7b8aa0}
.ask button{border:0;background:#22d3ee;color:#03141a;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px}
.stage.has-drawer .ask{left:140px;transform:none;width:min(440px,calc(100% - 640px))}
.stage.has-drawer .hint-chip{left:calc(50% - 240px)}
.hint-chip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;background:#0f1726;border:1px solid #2a3850;color:#cbd5e1;border-radius:999px;padding:5px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.hint-chip button{background:none;border:0;color:#22d3ee;font-weight:700;font-size:12.5px;padding:0}

/* Drawer */
.drawer{position:absolute;top:10px;right:88px;bottom:10px;width:390px;max-width:calc(100% - 20px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;z-index:8;display:flex;flex-direction:column;box-shadow:0 14px 50px rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.dh .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dh h3{margin:0;font-size:15.5px;flex:1;min-width:0}
.dh .sub{font-size:12px;color:var(--muted);font-weight:400}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--fg)}
.db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.chip input{position:absolute;opacity:0;pointer-events:none}
.db input[type=text],.db input[type=number],.db input[type=date],.db select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:13px;width:100%;min-width:0;color:var(--fg)}
.db input:focus,.db select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.rule{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.rule .vals{display:flex;flex-wrap:wrap;gap:4px}
.rule .vals .chip{padding:2px 8px;font-size:12px}
.pathbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pathbox-h{display:flex;gap:6px;align-items:center}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:600}
.mini:hover{border-color:var(--accent)}
.say{font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.5}
details.adv{border-top:1px solid var(--line);padding-top:12px}
details.adv summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
details.adv[open] summary{margin-bottom:12px}
.adv-b{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.tog small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line);border:0;flex:none;margin-top:1px}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]:after{left:18px}
.pc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:3px 4px 3px 4px;font-size:12.5px;font-weight:600}
.pc i{width:20px;height:20px;border-radius:50%;background:#1f1638;display:grid;place-items:center}
.pc i svg{width:11px;height:11px;stroke:#ddd6fe;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pc button{border:0;background:none;color:var(--violet);font-size:15px;padding:0 5px;line-height:1}
.del{border:1px solid var(--rose-soft);background:var(--surface);color:var(--rose);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}
.del:hover{border-color:var(--rose)}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.cat{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:8px 10px}
.opt:hover{background:var(--surface-2);border-color:var(--line)}
.opt .oi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#141c2c;flex:none}
.opt .oi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt .oi.dwc{border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b2a63,#1a1230);border:1.5px solid #8b5cf6}
.opt .oi.dwc svg{stroke:#ddd6fe}
.opt b{display:block;font-size:13.5px}
.opt span{display:block;font-size:12px;color:var(--muted)}
.samples{display:flex;gap:6px;flex-wrap:wrap}
.smp{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.smp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.rsum{font-size:13px;display:flex;flex-direction:column;gap:4px}
.rsum .m{color:var(--muted)}
.stg{display:flex;flex-direction:column;gap:6px}
.stg-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.who{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.who-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px}
.who-t b{font-weight:600}
.who-p{color:var(--muted);font-size:12.5px;text-align:right}
.fine{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.fine i{font-style:normal;flex:none;width:12px;text-align:center}
.fine.warn i{color:var(--amber)}.fine.ok i{color:var(--emerald)}
.st{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.st.ok{background:var(--emerald-soft);color:var(--emerald)}.st.new{background:var(--accent-soft);color:var(--accent-strong)}.st.warn{background:var(--amber-soft);color:var(--amber)}
.okbox{border:1px solid var(--emerald);background:var(--emerald-soft);color:var(--emerald);border-radius:10px;padding:10px 12px;font-size:13px}
.okbox b{display:block}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.sug .row{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px}

.scrim{position:fixed;inset:0;background:rgba(3,8,15,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal .db{padding:18px}
.big{font-size:15px;line-height:1.5}
.big b{font-variant-numeric:tabular-nums}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.issue{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.issue i{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.issue.bad i{background:var(--rose-soft);color:var(--rose)}.issue.warn i{background:var(--amber-soft);color:var(--amber)}.issue.ok i{background:var(--emerald-soft);color:var(--emerald)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#0b1220;color:#e2e8f0;border:1px solid #1f2a3d;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* v4 additions */
.rulepage{position:absolute;inset:0;overflow:auto;background:var(--bg);display:none;padding:22px 16px 40px;z-index:5}
.stage.is-rule .rulepage{display:block}

  case 'in':return (x.v||[]).includes(v); case 'not_in':return v!=null&&!(x.v||[]).includes(v);

/* ---------- lint ---------- */
function lintFlow(f){
  if(f.kind==='rule'){ const recs=HISTORY.filter(h=>f.records.includes(h.record)&&h.event===f.event&&rowsMatch(f.when,h)), out=[];
    if(!f.act.approve&&!f.act.task&&!f.act.flag) out.push({sev:'bad',m:'This rule doesn\u2019t do anything yet. Choose at least one action under Then.'});
    if(f.act.approve&&!f.act.roles.length) out.push({sev:'bad',m:'Choose who must approve.'});
    if(!(f.when.rows||[]).length) out.push({sev:'warn',m:'With no conditions, this rule applies to every request. If that\u2019s intended, put the step in the flows instead.'});
    out.push({sev:'info',m:`Matched ${recs.length} requests in the last 90 days.`}); return {out,runs:[],recs}; }
  if(f.tab==='workflows'){ const out=[], NN=f.nodes, recs=HISTORY.filter(h=>f.records.includes(h.record)&&h.event===f.event&&scopeMatch(f.scope,h)), ms=Object.values(NN).filter(n=>n.kind==='milestone');
    Object.values(NN).forEach(n=>{
      if(n.kind==='collect'&&!n.items.length) out.push({sev:'warn',node:n.id,m:`“${title(n)}” doesn\u2019t ask for anything yet.`});
      if(n.gives&&!n.reverse) out.push({sev:'bad',node:n.id,fix:'rev:'+n.id,fl:'Add a reverse step',m:`“${title(n)}” gives ${n.gives} but has no reverse step, so offboarding would leave it behind.`});
      if(n.kind==='system'&&!n.gives&&['Workday','ServiceNow','Okta','Microsoft Entra ID'].includes(n.system)&&ensureSys(n).action==='create'&&!/payroll|sync|run/i.test(n.label||'')) out.push({sev:'tip',node:n.id,fix:'gr:'+n.id,fl:'Record it in the ledger',m:`“${title(n)}” creates something in ${n.system} that isn\u2019t in the ledger, so offboarding won\u2019t know to remove it.`});
      if(['collect','system'].includes(n.kind)&&n.req!=='none'&&ms.length&&!nextMs(f,n.id)) out.push({sev:'warn',node:n.id,m:`“${title(n)}” comes after the last milestone, so it isn\u2019t required for anything. Move it, or set Required for to Not required.`});
      if(n.kind==='runappr'&&n.source==='here'&&!(n.roles||[]).length) out.push({sev:'bad',node:n.id,m:`“${title(n)}” doesn\u2019t say who approves yet.`});
      if(n.kind==='runappr'&&n.source!=='here'&&!FLOWS.some(x=>x.id===n.target)) out.push({sev:'bad',node:n.id,m:`“${title(n)}” doesn\u2019t point to an approval flow.`});
      if(n.kind==='collect'&&n.failTo==='approval'&&!FLOWS.some(x=>x.id===n.failFlow)) out.push({sev:'bad',node:n.id,m:`“${title(n)}” sends failures to an approval flow that doesn\u2019t exist.`});
      if(['cond','plan','parallel'].includes(n.kind)&&n.outs.length>1&&n.outs.every(x=>x.to===n.outs[0].to)&&n.kind!=='parallel') out.push({sev:'warn',node:n.id,m:`“${title(n)}” sends every path to the same place, so it does nothing yet.`});
      if(n.kind==='milestone'){ const before=Object.values(NN).filter(x=>reqOf(f,x)===n.id); if(!before.length&&(MS_KIND[n.label]||'ready')==='ready') out.push({sev:'warn',node:n.id,m:`Nothing is required for “${title(n)}”, so it\u2019s reached straight away.`}); }
      if(n.kind==='runwf'){ const t=FLOWS.find(x=>x.id===n.target); if(t&&Object.values(t.nodes).some(m=>m.kind==='runwf'&&m.target===f.id)) out.push({sev:'bad',node:n.id,m:`“${title(n)}” starts “${t.name}”, which starts this workflow again. They would start each other forever.`}); } });
    if(Object.values(NN).some(n=>n.gives)&&!FLOWS.some(x=>x.tab==='workflows'&&x.records.includes('offboarding'))) out.push({sev:'warn',m:'Things are given to workers, but there is no Offboarding workflow to take them back.'});
    return {out,runs:[],recs}; }
  const res=lint(f);

    const save=Math.min(...a.roles.map(x=>HOURS[ROLES[x].c]),...nx.roles.map(x=>HOURS[ROLES[x].c]),24)/8; res.out.push({sev:'tip',node:a.id,fix:'merge:'+a.id+':'+nx.id,fl:'Ask them together',m:`“${title(a)}” and “${title(nx)}” are asked one after the other. Neither needs the other\u2019s answer, so they can be asked in one round.`}); } });

}
function applyFix(f,fix){ const [k,a,b]=fix.split(':');

  if(k==='merge'){ const A=f.nodes[a], Bn=f.nodes[b]; A.roles=[...new Set([...A.roles,...Bn.roles])]; A.mode='all'; A.prechecks=[...new Set([...(A.prechecks||[]),...(Bn.prechecks||[])])]; A.label=`${title(A)} + ${title(Bn)}`; A.outs=Bn.outs; delete f.nodes[b]; return 'Merged: they\u2019re now asked together'; }

/* ---------- layout ---------- */
const SQ=88;
function layout(f){
  const NN=f.nodes, ids=Object.keys(NN), tg=n=>n.outs.map(x=>x.to).filter(t=>t&&NN[t]), lvl={}, indeg={};
  ids.forEach(i=>{lvl[i]=0;indeg[i]=0;}); ids.forEach(i=>tg(NN[i]).forEach(t=>indeg[t]++));
  const q=ids.filter(i=>!indeg[i]), topo=[]; while(q.length){ const i=q.shift(); topo.push(i); tg(NN[i]).forEach(t=>{ if(--indeg[t]===0) q.push(t); }); }
  topo.forEach(i=>tg(NN[i]).forEach(t=>{ lvl[t]=Math.max(lvl[t],lvl[i]+1); }));
  if(NN.END) lvl.END=Math.max(...ids.map(i=>lvl[i]));
  const row={}, occ=new Set(); const place=(id,rw)=>{ while(occ.has(lvl[id]+':'+rw)) rw--; row[id]=rw; occ.add(lvl[id]+':'+rw); };
  const dfs=(id,rw)=>{ if(!NN[id]||row[id]!=null) return; place(id,rw); const outs=NN[id].outs; if(!outs.length) return; dfs(outs.at(-1).to,row[id]); outs.slice(0,-1).forEach((x,i,a)=>dfs(x.to,row[id]-(a.length-i))); };
  dfs('T',0);
  const condLvls=[...new Set(ids.filter(i=>NN[i].kind==='cond').map(i=>lvl[i]))], minR=Math.min(...Object.values(row)), pos={};
  Object.keys(row).forEach(i=>pos[i]={x:70+lvl[i]*220+88*condLvls.filter(l=>l<lvl[i]).length,y:90+condPad(f)+(row[i]-minR)*176,lvl:lvl[i],row:row[i]});
  return {pos,W:Math.max(...Object.values(pos).map(p=>p.x))+260,H:Math.max(...Object.values(pos).map(p=>p.y))+220};
}

  if(f.tab==='workflows'){ S.run=wfRun(f,rec); return; }
  const list=testList(), p=plan2(rec,list); S.run={kind:'ap',rec,plan:p,walk:p.main&&p.main.flow.id===f.id?p.walk:null}; if(smp.edit&&S.edited) S.run.plan0=plan2({...smp},list);

function onField(e,isChange){

  if(d.rurole!==undefined){ f.act.roles=t.checked?[...f.act.roles,d.rurole]:f.act.roles.filter(x=>x!==d.rurole); refresh(); return; }
  if(d.planrole!==undefined&&isChange){ const out=n.outs.find(x=>x.key==='out'); const target=f.nodes[out.to];
    if(target&&target.kind==='appr') target.roles=[t.value];
    else { const aid=newId(f); f.nodes[aid]=APPR(aid,'Outside plan',[t.value],out.to,{prechecks:['brief','budget']}); out.to=aid; }
    refresh(); return; }
  if(d.fs==='days'&&isChange){ f.days=Math.max(1,+t.value||30); refresh(); return; }
  if(d.fs==='source'&&isChange){ f.source=t.value; refresh(); return; }
  if(d.fs){ const k=d.fs;
    if(k==='name'){ f.name=t.value; renderTop(); return; }
    if(k==='when'&&isChange){ const [rc,ev]=t.value.split('|'); f.records=[rc]; f.event=ev; refresh(); return; }

  if(d.ojoin!==undefined){ n.outs[+d.ojoin].join=t.value; refresh(false); return; }

/* ---- field approvals ---- */
function faParse(txt){ const t=' '+txt.toLowerCase()+' ', out={}; let m;
  const fld=[['bill_rate',/\brate\b/],['months_engaged_after',/\bmonths?\b/],['end_date',/end date|extension|extend/],['cost_center',/cost cent/],['business_unit',/business unit/],['legal_entity',/legal entity/],['country',/country|location/],['site',/\bsite\b/],['job_family',/job family/],['engagement',/worker type|engagement|payroll/],['data_access',/data access|client data/],['total_value',/total|value|amount|budget|spend/]];
  const fh=fld.find(([k,re])=>re.test(t)); if(fh) out.field=fh[0];
  const up=/(goes up|go up|increase|rais|rise|rises|higher|more than|over|above|past|beyond)/.test(t);
  if((m=t.match(/(\d+(?:\.\d+)?)\s*%/))&&up){ out.change='up_pct'; out.amount=+m[1]; }
  else if(out.field==='months_engaged_after'&&(m=t.match(/(\d+)\s*months?/))){ out.change='over'; out.amount=+m[1]; }
  else if((m=t.match(/\$\s*(\d[\d,.]*)\s*(k|m)?/))&&up){ out.change='up_amt'; out.amount=money(m[1],m[2]); }
  else if(/(goes down|decrease|lower|reduc|drops)/.test(t)) out.change='down';
  else if(out.field==='end_date'&&/(later|extend|pushed out|moves out)/.test(t)) out.change='later';
  else if(/earlier|brought forward/.test(t)) out.change='earlier';
  else if(up&&!/more than one/.test(t)&&['bill_rate','total_value'].includes(out.field)) out.change='up';
  else if(out.field==='data_access'&&/(turns on|gets|added|needs)/.test(t)) out.change='on';
  else out.change='any';
  if(out.field&&(FA_F[out.field]||[])[1]==='enum'){ const vals=(FIELD[out.field]||{o:[]}).o.filter(v=>t.includes(' '+String(v).toLowerCase())); if(vals.length&&/\bto\b/.test(t)){ out.change='to'; out.vals=vals; } }
  const {roles}=rolesIn(t); const gs=Object.entries(GROUPS).filter(([k,g])=>t.includes(g.n.toLowerCase())).map(([k])=>'g:'+k); const ps=PEOPLE.filter(p=>t.includes(p.toLowerCase())).map(p=>ensureRole('p:'+p));
  out.roles=[...roles,...gs,...ps];
  const recs=[['work_order',/work order/],['assignment',/assignment|extension|extend/],['sow',/\bsow\b|statement of work/],['job_posting',/job posting/]].filter(([k,re])=>re.test(t)).map(([k])=>k); if(recs.length) out.records=recs;
  return out; }
function faSentence(f){ const fl=(FA_F[f.field]||[f.field])[0], who=f.roles.map(x=>ROLES[ensureRole(x)].n), w=who.length?who.join(f.mode==='any'?' or ':' and '):'(choose who approves)';
  return `Whenever the ${fl.toLowerCase()} on a ${f.records.map(x=>RECORDS[x].toLowerCase()).join(' or ')} ${faShort(f).split(': ')[1]}, ${w} must approve that change. ${f.onReject==='all'?'If they reject, the whole request goes back to the requester.':'If they reject, the old value stays and the rest of the change goes ahead.'}`; }
function faExample(f){ const s=SAMPLES.find(x=>(faChange(f,x)||{}).hit); if(!s) return '<span class="empty">No sample request triggers this yet.</span>'; const c=faChange(f,s);
  return `<div class="who"><div class="who-t"><b>${esc(s.id)} · ${esc(s.title)}</b><span class="st warn">Needs approval</span></div><div class="fine"><i>Δ</i>${esc(FA_F[f.field][0])}: ${esc(faVal(f,c.was))} → <b>${esc(faVal(f,c.now))}</b>${c.pct!=null?` (${c.pct>0?'+':''}${c.pct}%)`:''}</div><div class="fine"><i>·</i>Everything else on the request is shown read-only. Approve or reject applies to this field only.</div></div>`; }
function fieldPage(f){ const t=(FA_F[f.field]||['','enum'])[1], chs=FA_CH[t]||FA_CH.enum;
  return `<div class="rcard"><div class="rc-h"><span class="tag">Field approval</span><h2>${esc(f.name)}</h2><p>Runs whenever this field changes on a request, from any workflow or from SAP Fieldglass. Only the change goes to the approver. The rest of the request carries on.</p></div>

      ${['up_pct','up_amt','over'].includes(f.change)?`<label><span class="lbl">${f.change==='up_pct'?'Percent':f.change==='up_amt'?'Amount ($)':'Value'}</span><input type="number" data-fa="amount" value="${f.amount??''}"></label>`:''}

    <div class="rc-sec"><span class="rc-step">Who approves</span><div class="chips">${f.roles.map(x=>`<span class="pc plain">${esc(ROLES[ensureRole(x)].n)}<button data-act="faroledel" data-r="${esc(x)}" aria-label="Remove">×</button></span>`).join('')||'<span class="empty">No one yet</span>'}</div>
      <select data-faroleadd style="margin-top:8px">${opt('','+ Add a role, group or person',true)}${whoOptions('')}</select>
      ${f.roles.length>1?`<div class="chips">${[['all','Everyone'],['any','Any one']].map(([v,l])=>chip('data-famode',v,l,(f.mode||'all')===v,'radio','famode')).join('')}</div>`:''}</div>
    <div class="rc-sec"><span class="rc-step">If they reject</span><select data-fa="onReject">${opt('revert','Keep the old value; the rest of the change goes ahead',f.onReject!=='all')}${opt('all','Send the whole request back to the requester',f.onReject==='all')}</select></div>
    <div class="rc-sec"><span class="rc-step">What the approver sees</span>${faExample(f)}</div>
    <div class="rc-sec say">${esc(faSentence(f))}</div></div>`; }
function faLint(f){ const out=[]; const recs=HISTORY.filter(h=>f.records.includes(h.record)&&h.prev&&(faChange(f,h)||{}).hit);
  if(!f.roles.length) out.push({sev:'bad',m:'Choose who approves this change.'});
  if(['up_pct','up_amt','over'].includes(f.change)&&!(+f.amount>0)) out.push({sev:'bad',m:'Enter the amount that triggers it.'});
  if(f.change==='to'&&!(f.vals||[]).length) out.push({sev:'bad',m:'Pick at least one value.'});

  const dist={}, q=[[n.id,0]]; while(q.length){ const [id,dd]=q.shift(); if(dist[id]!==undefined||!f.nodes[id]) continue; dist[id]=dd; f.nodes[id].outs.forEach(x=>q.push([x.to,dd+1])); }
